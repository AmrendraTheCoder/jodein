# railway.toml — Multi-process Nixpacks Configuration
#
# This file configures the deployment behavior for Jodein.
# Depending on the Railway service, set the Start Command accordingly:
#
# 1. Main REST/Fastify Server:
#    Start Command: npm run start
#
# 2. BullMQ Ingest Worker (Handles main message processing & AI replies):
#    Start Command: npm run worker:ingest
#
# 3. BullMQ Notify Worker (Handles bulk activation & attendance alerts):
#    Start Command: npm run worker:notify
#

[build]
builder = "nixpacks"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/health"
healthcheckTimeout = 30
